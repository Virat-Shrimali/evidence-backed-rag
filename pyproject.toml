[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-backed-rag"
version = "0.1.0"
description = "Evidence-backed RAG system with verifiable chunk-level citations, refusal on insufficient evidence, and empirical evaluation harness"
readme = "README.md"
requires-python = ">=3.11, <3.12"
authors = [
    { name = "Virat Shrimali", email = "viratns05@gmail.com" }
]
dependencies = [
    "streamlit>=1.41.0,<2.0.0",
    "httpx>=0.28.0,<1.0.0",
    "pydantic>=2.10.0,<3.0.0",
]

[project.optional-dependencies]
backend = [
    "pydantic-settings>=2.7.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "tqdm>=4.66.0",
    "pypdf>=5.1.0",
    "pdfplumber>=0.11.0",
    "tiktoken>=0.8.0",
    "pysbd>=0.3.4",
    "sentence-transformers>=3.3.0",
    "chromadb>=0.5.23",
    "rank-bm25>=0.2.2",
    "openai>=1.59.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.20",
    "ragas>=0.2.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "evaluation*", "api*", "app*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: marks integration tests requiring model loading",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501", # line too long handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"app/streamlit_app.py" = ["E402"]
